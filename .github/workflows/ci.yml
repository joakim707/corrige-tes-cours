name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/CorrigeTesCours.sln

      - name: Build
        run: dotnet build backend/CorrigeTesCours.sln --no-restore -c Release

      - name: Test + couverture
        run: dotnet test backend/CorrigeTesCours.sln --no-build -c Release --logger "trx" --results-directory ./test-results --collect:"XPlat Code Coverage"

      - name: Publier les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./test-results

      - name: Résumé de couverture dans le run
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./test-results/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Ajouter le résumé au run GitHub Actions
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Gate de déploiement : Render/Vercel ne déploient qu'après succès de ces deux jobs
  # (Deploy Hooks déclenchés ici, Auto-Deploy désactivé côté Render/Vercel — voir README).
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Déclencher le déploiement Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
