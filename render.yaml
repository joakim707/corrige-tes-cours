services:
  - type: web
    name: corrige-tes-cours-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Issuer
        value: corrige-tes-cours
      - key: Jwt__Audience
        value: corrige-tes-cours-web
      - key: Jwt__AccessTokenMinutes
        value: "15"
      - key: Jwt__RefreshTokenDays
        value: "7"
      - key: Ai__BaseUrl
        value: https://openrouter.ai/api/v1
      - key: Ai__Model
        value: meta-llama/llama-3.3-70b-instruct
      - key: Ai__TimeoutSeconds
        value: "30"
      # Secrets — Render les demandera dans un formulaire à la création du Blueprint,
      # jamais stockés dans ce fichier.
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Ai__ApiKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
